<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Kuwento Quest Sneak Peek | Salita</title><meta name="description" content="Play the opening of Kuwento Quest, a story game where children and grown-ups learn Tagalog side by side."><link rel="icon" href="../salita-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,900&family=Noto+Sans+Tagalog&display=swap">
<style>
/* Layout: one centered "stage" like a story game. Illustrated scene on top, portrait + dialogue box under it, a turn panel below. Night world, single dark look by choice. */
:root{
  --night:#10142e; --night-2:#1a2048; --night-3:#2a3270;
  --moon:#f4cf6e; --moon-glow:#f4cf6e33;
  --paper:#f6ecd8; --paper-2:#e9dcbf; --ink:#1d1830; --ink-soft:#6b5d47;
  --seer:#4fc1b4; --keeper:#ef8a5f; --leaf:#3f7a4a;
  --text:#eef0fa; --muted:#a8afd6;
  --display:"Young Serif", Georgia, serif;
  --body:"Nunito Sans", system-ui, -apple-system, sans-serif;
  --baybayin:"Noto Sans Tagalog", serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:900;background:var(--moon);color:var(--ink);letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--night-3)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.ink{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- HUD ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--night-3)}
.dots i.on{background:var(--moon)}
.dots i.now{box-shadow:0 0 0 3px var(--moon-glow)}
.iconbtn{background:var(--night-2);border:0;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;display:inline-flex;gap:6px;align-items:center}
.iconbtn b{color:var(--moon)}

/* ---------- Stage ---------- */
.stage{position:relative;border-radius:18px;overflow:hidden;background:#0b0f26;box-shadow:0 20px 50px #0008, inset 0 0 0 1px #ffffff10}
.art{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:100%}
.art .spot{fill:transparent;cursor:pointer}
.art.seeking .spot{fill:#ffffff01}
.art.hinting .spot.live{stroke:var(--moon);stroke-width:2;stroke-dasharray:4 5;animation:pulse 1.2s ease-in-out infinite}
.art .spot.found{stroke:var(--seer);stroke-width:2.5;fill:#4fc1b41a;animation:none}
@keyframes pulse{50%{stroke-opacity:.25}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.fly{animation:fly 4s ease-in-out infinite}
@keyframes fly{50%{transform:translate(6px,-8px)}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.wave{animation:wave 5s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-14px)}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.shake{animation:shake .25s linear infinite}
@keyframes shake{25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
@media (prefers-reduced-motion:reduce){.twinkle,.fly,.blink,.wave,.bob,.shake,.art.hinting .spot.live{animation:none}}
.found-pop{position:absolute;pointer-events:none;font-family:var(--display);font-size:22px;color:var(--moon);text-shadow:0 2px 10px #000;transform:translate(-50%,-50%);animation:pop 1.2s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-140%)}}

/* ---------- Dialogue ---------- */
.dialog{position:relative;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:end;margin-top:-56px;padding-inline:12px;z-index:2}
.portrait{width:96px;height:112px;border-radius:14px;background:var(--night-2);box-shadow:0 0 0 3px var(--paper),0 8px 20px #0007;overflow:hidden}
.portrait svg{width:100%;height:100%;display:block}
.portrait.narr{visibility:hidden}
.box{position:relative;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 18px 18px;min-height:112px;box-shadow:0 8px 24px #0007;border:0;text-align:left;width:100%;min-width:0;cursor:pointer}
.box .name{position:absolute;top:-14px;left:14px;background:var(--ink);color:var(--paper);font-weight:900;font-size:13px;letter-spacing:.06em;padding:4px 12px;border-radius:999px;text-transform:uppercase}
.box .name.seer{background:var(--seer);color:var(--ink)}
.box .name.keeper{background:var(--keeper);color:var(--ink)}
.box .name.narr{background:var(--paper-2);color:var(--ink-soft)}
.box .line{font-size:18px;line-height:1.5}
.box .line.narr{font-style:italic;color:#4a3f30}
.box .line span{opacity:0}
.box .line span.on{opacity:1}
.box .line .tl{font-weight:900;color:#a8452c}
.box .more{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--ink-soft);font-weight:800}
.box .more i{display:inline-block;animation:bob 1s ease-in-out infinite;font-style:normal}

/* ---------- Turn panel ---------- */
.panel{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.turn{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--night-2)}
.turn .who{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.turn.seer .who{background:var(--seer)} .turn.keeper .who{background:var(--keeper)} .turn.both .who{background:var(--moon)}
.turn p{margin:0;font-weight:600;min-width:0}

.notebook{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;
  background-image:linear-gradient(transparent 31px,#d9c9a6 32px);background-size:100% 32px;background-position:0 10px;box-shadow:inset 6px 0 0 #c9533a55}
.notebook .hd{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--ink-soft)}
.notebook .word{font-family:var(--display);font-size:44px;line-height:1;color:#a8452c}
.notebook .say{font-size:15px;color:var(--ink-soft)}
.notebook .say b{color:var(--ink)}
.notebook .clue{font-size:16px;background:#fffaf0;border-radius:10px;padding:10px 12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:#fffaf0;border:2px solid var(--ink);border-radius:12px;padding:12px 8px;font-weight:800;color:var(--ink)}
.opt.no{opacity:.35;text-decoration:line-through}
.opt.yes{background:var(--ink);color:var(--paper)}
.msg{font-weight:700;font-size:15px}

/* dice */
.dice{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--night-2);border-radius:14px;padding:14px}
.die{width:84px;height:84px;border-radius:18px;background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13px;gap:2px;border:0;box-shadow:0 6px 0 var(--paper-2),0 10px 20px #0006}
.die i{width:14px;height:14px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.rolling{animation:roll .55s ease}
@keyframes roll{0%{transform:rotate(0)}30%{transform:rotate(-200deg) scale(1.1)}60%{transform:rotate(-320deg)}100%{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}}
.dice .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.dice .goal{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #f4cf6e66;background:transparent;color:var(--moon);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--moon);color:var(--ink)}
.total{font-family:var(--display);font-size:28px;color:var(--moon);font-variant-numeric:tabular-nums}

/* noise */
.noise{background:var(--night-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.meter{height:22px;border-radius:999px;background:#0b0f26;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff15}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--keeper),var(--moon));transition:width .12s}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pot{border:0;border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;color:var(--ink);touch-action:manipulation}
.pot.k{background:var(--seer)} .pot.a{background:var(--keeper)}
.pot svg{width:64px;height:48px}
.pot:active{transform:scale(.94)}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.count button{border:0;border-radius:16px;padding:18px 6px;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:24px}
.count button.done{background:var(--moon)}
.count button small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:var(--ink-soft)}

/* trace */
.trace{background:var(--paper);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.trace canvas{width:100%;height:auto;aspect-ratio:2/1;background:#fffaf0;border-radius:10px;touch-action:none;max-width:100%}

/* ---------- Title & map ---------- */
.title-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:linear-gradient(transparent 35%,#10142ecc 75%)}
.title-card h1{font-size:clamp(36px,9vw,60px);color:var(--paper);text-shadow:0 4px 20px #000}
.title-card p{margin:6px 0 0;color:var(--paper);opacity:.9;max-width:34ch}
.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;color:var(--moon)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.role{background:var(--night-2);border-radius:16px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.role .portrait{width:72px;height:84px}
.role h3{font-size:19px}
.role.seer h3{color:var(--seer)} .role.keeper h3{color:var(--keeper)}
.role p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.role label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.role input{width:100%;background:var(--night);border:1.5px solid var(--night-3);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;font-weight:700}
.howto{margin-top:14px;background:var(--night-2);border-radius:16px;padding:14px 16px;font-size:15px;color:var(--muted)}
.howto b{color:var(--text)}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qcard{position:relative;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--night-2);text-align:left;display:flex;flex-direction:column}
.qcard .thumb{aspect-ratio:4/3;width:100%;display:block}
.qcard .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.qcard .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.qcard h3{font-size:16px}
.qcard .tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.tag.free{background:var(--seer);color:var(--ink)} .tag.lock{background:#000a;color:var(--paper)} .tag.mem{background:var(--moon);color:var(--ink)}
.qcard.locked .thumb{filter:grayscale(.7) brightness(.55)}
.club{margin-top:18px;border-radius:18px;padding:3px;background:repeating-linear-gradient(45deg,#c9a46a 0 3px,#e9dcbf 3px 9px)}
.club .in{background:var(--paper);color:var(--ink);border-radius:15px;padding:20px;display:flex;flex-direction:column;gap:12px}
.club h2{font-size:26px}
.club ul{margin:0;padding-left:20px}
.storylist{margin-top:16px;background:var(--night-2);border-radius:16px;padding:14px}
.storylist .row{flex-wrap:wrap;gap:8px}
.storypage{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px 20px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.storypage p{margin:0;font-family:var(--display);font-size:19px;line-height:1.6}
.storypage p.storytip{font-family:inherit;font-size:14px;line-height:1.5;color:var(--ink-soft);background:#f1e4c6;border-radius:12px;padding:10px 12px}
.storypage .tl{color:#a8452c}
.storypage .ssay{font-family:inherit;font-size:12.5px;color:var(--ink-soft);font-style:italic}
.storyend{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-size:20px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:2px solid var(--ink);border-radius:12px;padding:12px;background:transparent;color:var(--ink);text-align:left}
.plan[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.plan strong{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.plan span{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--night-2);border-radius:10px;padding:10px 12px}

.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.sheet .tokens{display:flex;flex-wrap:wrap;gap:8px}
.sheet .tok{background:#fffaf0;border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.sheet .tok b{font-family:var(--display);font-weight:400;font-size:18px;color:#a8452c;display:block}

@media (max-width:560px){
  .dialog{grid-template-columns:70px 1fr;gap:10px;margin-top:-40px;padding-inline:6px}
  .portrait{width:70px;height:84px}
  .box{min-height:100px;padding:16px 14px 18px}
  .box .line{font-size:16.5px}
  .roles{grid-template-columns:1fr}
  .map{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}
  .notebook .word{font-size:38px}
}
/* frame: tattoo-geometry border, like the Salo Salo card borders */
.frame{padding:7px;border-radius:24px;background:
  linear-gradient(135deg,var(--night) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--night) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--night) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--night) 25%,transparent 25%) 0 0/14px 14px,
  #b8904f;box-shadow:0 20px 50px #0008}
.frame .stage{box-shadow:none;border-radius:17px}
.scene-name{position:absolute;top:10px;left:12px;background:#10142ecc;color:var(--paper);font-family:var(--display);font-size:14px;padding:4px 12px;border-radius:999px}
.box{background-color:var(--paper);background-image:repeating-linear-gradient(90deg,#8a6a3e0d 0 7px,transparent 7px 14px),repeating-linear-gradient(0deg,#8a6a3e0d 0 7px,transparent 7px 14px)}
.party{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:14px}
.hero-chip{display:flex;gap:8px;align-items:center;background:var(--night-2);border-radius:12px;padding:6px 10px 6px 6px;min-width:0}
.hero-chip.seer{box-shadow:inset 3px 0 0 var(--seer)} .hero-chip.keeper{box-shadow:inset -3px 0 0 var(--keeper);flex-direction:row-reverse;text-align:right;padding:6px 6px 6px 10px}
.hero-chip .mini{width:34px;height:40px;border-radius:8px;overflow:hidden;flex:none}
.hero-chip .mini svg{width:100%;height:100%;display:block}
.hero-chip>div:not(.mini){min-width:0;flex:1}
.hero-chip b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-chip small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-chip .gi{width:30px;height:30px;flex:none;background:var(--paper);border-radius:8px;padding:2px}
.hero-chip .gi svg{width:100%;height:100%;display:block}
.suns{display:flex;flex-direction:column;align-items:center;gap:2px}
.suns span{display:inline-block;width:20px;height:20px;transition:opacity .3s}
.suns span svg{width:100%;height:100%}
.suns>span{display:inline-block}
.suns{flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:80px}
.suns small{width:100%;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.suns .off{opacity:.18}
.goal{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--night-2);border-radius:12px;padding:10px 14px}
.goal b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.pips{display:flex;gap:6px}
.pips i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--moon)}
.pips i.on{background:var(--moon)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{text-align:left;border:0;border-radius:14px;padding:14px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--paper-2);min-width:0}
.act:hover{transform:translateY(-2px)}
.act b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.act>span:not(.tags){font-size:14px;color:var(--ink-soft)}
.act small{font-size:12px;font-weight:800;color:#a8452c}
.act.special{box-shadow:inset 0 0 0 2px #b8904f,0 4px 0 var(--paper-2)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.req{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--paper)}
.req.auto{background:var(--seer);color:var(--ink)}
.req.gear{background:#b8904f;color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{border:0;border-radius:14px;padding:14px;background:var(--paper);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--paper-2)}
.pick:hover{transform:translateY(-2px)}
.pick .pi{width:56px;height:56px;background:#fffaf0;border-radius:12px;padding:4px}
.pick .pi svg{width:100%;height:100%;display:block}
.pick b{font-family:var(--display);font-weight:400;font-size:19px;text-transform:capitalize}
.pick span:last-child{font-size:14px;color:var(--ink-soft)}
.goal-n{font-weight:800}
.wmsg{font-size:14px;color:var(--muted)}
.wmsg b{color:var(--moon)}
.noise .head{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}
.noise .head b{color:var(--moon)}
@media (max-width:560px){.acts,.picks{grid-template-columns:1fr}.party{grid-template-columns:1fr 1fr}.suns{grid-column:1/-1;grid-row:1;max-width:none;flex-wrap:nowrap}.suns small{width:auto;margin-left:6px}}
.offscreen{background:var(--paper);color:var(--ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px #b8904f}
.offscreen .eyebrow{color:var(--ink-soft)}
.offscreen b{font-size:18px;line-height:1.45}
.offscreen .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-soft)}
.secret-btn{border:2px dashed var(--moon);background:var(--night-2);color:var(--moon);border-radius:16px;padding:28px 16px;font-weight:900;font-size:17px}
.gl{font-family:var(--baybayin);line-height:1;color:#a8452c}
.gl.big{font-size:72px;text-align:center;padding:6px 0}

 {name:"The Shore",art:(s)=>ART.shore(s.tail),carve:{da:[44,226],ta:[112,232],cross:[352,222]},spots:{sea:[80,214,52,"dagat","All that water, as far as you can see."],tail:[300,140,60,"malaki","It's longer than ten houses."]},beats:[
  {say:"narr",t:"The path ends at the beach. The water is wild tonight, crashing and churning."},

  {seek:"kid",t:"Look! What just came out of the sea?",spots:["tail"],tap:"the long shape rising out of the waves"},
  {say:"bakunawa",shot:"eye",t:"Mmmmmm. So round. So shiny. The moon is mine now."},
  {say:"keeper",shot:null,cam:null,t:"I think I've seen this in Lola's notebook. We need to get closer without it seeing us."},

  {decode:{word:"dagat",title:"The creature page",lock:true,set:{weakness:true},ok:"*Dagat*. 'The serpent of the dagat.' Under it, Lola wrote: hates noise, bang the pots!",skip:"You'll have to learn about the creature the hard way."}},

    {id:"mata",req:"tarsier",label:"Mata keeps watch",d:"He'll squeak when the eye looks away.",dc:3,fits:["malaki"],ok:"Mata watches the giant eye. Squeak! You move. Squeak! You freeze. It works!",fail:"Mata squeaks at the wrong time. Oops."},
    {id:"tandang",req:"tandang",label:"Hold Tandang's beak shut",d:"Tiptoe past. Please don't crow.",dc:5,ok:"Tandang glares at you, but he stays quiet. Good rooster.",fail:"COCKADOODLE- The Bakunawa's head whips around!"},
    {id:"tuko",req:"tuko",label:"Tuko leads you over the rocks",d:"He knows every crack.",dc:3,ok:"Tuko scrambles ahead and shows you every safe foothold.",fail:"Tuko finds a crab. The crab wins."}

    {id:"hide",label:"Crouch behind the rocks",d:"Wait for the right moment.",dc:4,fits:["gabi","dagat"],ok:"A big wave crashes and covers your footsteps. Go!",fail:"You crouch... on a sea urchin. Ouch."},
    {id:"lantern",req:"lantern",label:"Wave the lantern far away",d:"It loves shiny things. Distract it.",dc:3,fits:["ilaw","buwan"],ok:"The Bakunawa turns to stare at the swinging light, hypnotized. You creep closer.",fail:"The light swings too close. Now it's staring at YOU."},

  {say:"narr",if:"!weakness",t:"Up close, you notice something. Every time a wave crashes, the Bakunawa flinches. It hates loud noise!"},

 {name:"Waking the Village",art:()=>ART.village(),carve:{la:[80,176],nga:[222,166],below:[353,178]},spots:{p1:[40,170,22,"kaldero","Lola cooks rice in one of these."],p2:[177,157,22,"kaldero","Lola cooks rice in one of these."],p3:[314,172,22,"kaldero","Lola cooks rice in one of these."]},beats:[

 {name:"Home Again",art:(s)=>ART.porch("back",s.closed?"closed":"open"),spots:{},beats:[
  {say:"lola",t:"Ang galing ninyo! You brought back the *buwan*. My Lola would be so proud of you two."},
  {say:"lola",if:"fireflies",t:"And you made friends with the alitaptap. Good manners always come back to you."},
  {say:"lola",t:"Hear that? The whole village is still saying the words. The Bakunawa won't come back to a place that remembers."},
  {say:"beecow",t:"Bzzz! The notebook is glowing so bright I need sunglasses."},
  {say:"lola",t:"Now. Let me see if you can read my notebook."},
  {read:true},
  {say:"lola",t:"One last thing. The title on the cover of my notebook. It has two shapes you've never seen, so I'll show you those myself."},
  {learn:{g:["wa","na"],m:[]}},
  {say:"lola",t:"Now you know every piece. Read my notebook's title."},
  {decode:{word:"buwan",title:"The cover",lock:true,set:{},ok:"*Buwan*. I named my notebook after the moon a long time ago. Tonight, you brought it back.",skip:"It says buwan. I named my notebook after the moon."}},
  {say:"lola",t:"Now write it yourselves, on the last page. Then the whole notebook will be bright again. For tonight."},
  {write:6},
  {say:"lola",t:"There. Now it's in my notebook, and it's in you."},
  {say:"narr",cam:[190,140,150,112],t:"Lola lifts the lid of the *baul*. Together, you lay the glowing notebook back inside."},
  {say:"lola",t:"My Lola gave this to me. Now it's yours, too. Keep it in your care, and open it whenever you want to remember."},
  {say:"narr",t:"Close the baul together. On three. Isa, dalawa, tatlo!"},
  {say:"narr",set:{closed:true},t:"Click. The latch shuts. The notebook is safe until next time."},

const QUEST2 = {
 n:2,lessons:[7,8,9,10,11,12],finalWord:"maganda",mythTitle:"Malakas and Maganda",
 title:"The Bird Who Split the Bamboo",
 doneLine:"Quest complete. The oldest story is written in again.",
 offscreen:"<b>Last mission, off screen:</b> tell the story of Malakas and Maganda to someone who wasn't here tonight. A grandparent on the phone counts.",
 myth:"This is one of the oldest creation stories told in the Philippines: a bird with nowhere to land, a quarrel between the sky and the sea, and a bamboo that splits open to reveal the first man and woman. The earliest written versions are Visayan, from the late 1500s, and they use other names for the first people (Sicalac and Sicavay, or Calgue and Cabaye). The names Malakas (strong) and Maganda (beautiful) came later, in a 1941 retelling that went into school textbooks for decades, and they were later used in Marcos-era palace paintings. Kuwento Quest follows the bird, the quarrel and the bamboo, uses the names most families know today, and ends the moment the first people step out. Some older versions continue with parts that aren't meant for children.",
 recap:f=>[f.driftwood?"Mata found driftwood for Lawin to rest on.":f.perch?"You made a rope perch so Lawin could rest.":"You helped Lawin rest his tired wings.",
  "You calmed the quarrel between the sky and the sea.",
  f.peek?"You saw two shadows inside the bamboo before it opened.":f.voices?"You heard two voices inside the bamboo.":"The bamboo had a big surprise inside.",
  S.rally?`You taught Malakas and Maganda ${S.rally} words.`:""],
 scenes:[
 {name:"Lola's Porch",amb:"night",art:(s)=>ART.porch2(s),spots:{ibon:[272,172,28,"ibon","It has feathers and wings. It just flew in out of the dark."]},beats:[
  {say:"narr",t:"A few nights after the moon came back. Every night now, the whole village says goodnight to it."},
  {say:"lola",set:{opened:true},cam:[190,140,150,112],t:"Come, mga apo. My notebook is so much brighter since you brought the moon home. But I want to show you something."},
  {say:"lola",shot:"notebook",t:"The very first page. See? It's blank. This page held the oldest story of all, the one about the very first people. My Lola told it to me under this same moon."},
  {say:"lola",t:"When a story isn't told for a long time, it fades, like a word nobody says. I only remember pieces. A bird. A bamboo. The sky and the sea, arguing."},
  {say:"beecow",t:"Bzzz-moo! Arguing? Like {k} and {a} over the last piece of mango?"},
  {say:"narr",shot:null,cam:null,set:{bird:true},t:"Then something swoops out of the dark, flaps twice, and lands right on the lid of the baul."},
  {seek:"kid",t:"Something just landed on the baul. Find it.",spots:["ibon"],tap:"the bird on the baul"},
  {say:"lawin",t:"Ay, finally. Something to stand on. Do you know how long I've been flying? Since the very beginning."},
  {say:"lola",t:"This is a lawin, a hawk. And I think he's the bird from the oldest story. He's lost his way back into it."},
  {say:"lawin",t:"The story is my home, but the page is blank, so I can't get back. Lola says you two bring words back. Can you bring back a whole story?"},
  {say:"lola",t:"Every story starts with one word. There's one written very faintly in the corner of the page. First, let's check your key page has the shapes you'll need."},
  {learn:{g:["i","ba","na"],m:["below","cross"],review:true}},
  {decode:{word:"ibon",title:"The first word",lock:false,set:{},ok:"*Ibon*. Bird. You read it with shapes you already know!",skip:"It says ibon. Bird."}},
  {say:"lola",t:"Write it at the top of the page, so the story knows where to begin."},
  {write:7},
  {say:"lola",t:"Now. You'll need help where you're going. {a}, take one thing from the baul."},
  {pick:"item",who:"adult",opts:["lantern","tambuli","rope"],after:{lantern:"Good. The very beginning of the world was very, very dark.",tambuli:"Good. Sometimes two loud voices need someone even louder to make them listen.",rope:"Abaca is strong. Something out there will need holding up."}},
  {say:"lola",t:"And {k}, your friend wants to come again."},
  {pick:"pal",who:"kid",opts:["tarsier","tandang","tuko"],after:{tarsier:"Mata has never seen the beginning of the world. Look at his eyes. So excited.",tandang:"Tandang, please don't crow at the sky. It might crow back.",tuko:"Tuko, no hiding inside the bamboo this time. We'll need it."}},
  {say:"lawin",t:"Before we go, play a game with me. Lawin Says!"},
  {together:{title:"Lawin Says",who:"lawin",steps:["Lawin says: flap your arms like an *ibon*. Big, slow flaps!","Lawin says: {k}, find something in your real house a bird could stand on. Point to it.","Lawin says: {a}, be the sky. {k}, be the sea. Make your sounds! Whoosh. Shhhh.","Lawin says: freeze like a bird on a branch. Now say *ibon* together!"]}},
  {say:"lawin",t:"Hold on to the notebook. And hold on to each other."},
  {say:"narr",t:"The blank page begins to glow. Brighter. Brighter. Then the porch, the village and the baul all fade away."}
 ]},
 {name:"Sky and Sea",amb:"sea",art:(s)=>ART.skysea(s),spots:{langit:[200,52,44,"langit","Above you, as far as you can look. Nothing up there but one tired bird."],dagat:[110,236,46,"dagat","Below you, as far as you can look."]},beats:[

 {scene:0,flags:{night:true,opened:true},title:"Lola's Porch",text:[
  "After dinner at Lola's house, Lola drags something heavy out onto the porch. It's old and wooden, with a brass latch. \"This is my *baul*,\" she says. \"It belonged to my Lola.\"",
  "Inside, something glows. It's a notebook, soft and worn, full of the family's words. Half of it is written in Baybayin, the old writing of the islands, and the pages are pale. \"Words are like little lights,\" Lola says. \"When we say them, they stay bright. When we stop, they fade.\"",
  "Very late that night, Lola wakes you up. \"Look up,\" she whispers. The sky is empty. \"Wala na ang *buwan*. The moon is gone.\" The Bakunawa has swallowed it. Lola hands you her notebook and one treasure from the baul. \"Bring it back,\" she says. \"Together.\""]},
 {scene:1,flags:{},title:"The Bamboo Path",text:[
  "The path to the sea runs through a forest of bamboo so thick you can't see your own feet. Then something blinks. Tiny lights float all around you.",
  "\"Bzzz. You need *ilaw*?\" say the fireflies. \"We only help people with good manners.\"",
  "Carved into the bamboo are old trail marks. When you read them, they say *gabi*, night: at night, follow the marks to the sea. Then you remember the word Lola says every time someone helps her. \"*Salamat*,\" you tell the fireflies, and they glow so bright that the whole path lights up."]},
 {scene:2,flags:{tail:true},title:"The Shore",text:[
  "The path ends at a wild, dark beach. The *dagat* crashes and churns. Then the water bulges, and something rises out of the waves: a tail longer than ten houses. It is so *malaki*.",
  "\"Mmmm,\" rumbles the Bakunawa. \"So round. So shiny. The moon is mine now.\"",
  "You hide behind the rocks and watch. Every time a big wave crashes, the Bakunawa flinches and squeezes its eyes shut. In Lola's notebook, under a drawing of a sea serpent, she wrote three words: Hates noise. Bang the pots."]},
 {scene:3,flags:{},title:"Waking the Village",text:[
  "Back in the village, every window is dark. On every porch sits a *kaldero*, a cooking pot, waiting for tomorrow's rice.",
  "In the middle of the plaza hangs an old bell with a word on it. You read it: *tulong*. Help. You ring it. BONG. BONG. Doors fly open.",
  "Mang Tomas sticks his head out in his pajamas. \"Tulong? Who needs help? The moon is GONE? Wait. I'm getting my kaldero.\" Soon the whole village is outside, and every person is holding a pot."]},
 {scene:4,flags:{},title:"The Big Noise",text:[
  "The whole village stands on the shore, pots raised. The Bakunawa glows from the inside, where the moon is.",
  "\"Now,\" says Lola, \"make as much *ingay* as you can. Bang your pots and shout every word you know.\" Everyone counts together: \"*Isa*... *dalawa*... *tatlo*!\"",
  "BANG! CLANG! BONG! The Bakunawa squeezes its eyes shut. \"TOO LOUD!\" it roars, and as it opens its mouth, out shoots the moon. Up, up, up she floats, back where she belongs."]},
 {scene:5,flags:{},title:"Home Again",text:[
  "\"Ang galing ninyo,\" says Lola. \"You were amazing.\" Her notebook glows so brightly now that the bee-cow says it needs sunglasses.",
  "On the cover, in Baybayin, is the notebook's name, and now you can read it: *buwan*. \"I named it after the moon,\" Lola says, \"a long time ago. And tonight, you brought her back.\"",
  "Together you lay the notebook back inside the baul and close the lid. Isa, dalawa, tatlo. Click. Then you go outside, find the real moon, and say goodnight to it."]}
];

 {scene:0,flags:{opened:true,bird:true},title:"Lola's Porch",text:[
  "A few nights after the moon came back, Lola opens her notebook to the very first page. It's blank. \"This page held the oldest story of all,\" she says, \"the one about the very first people. But when a story isn't told for a long time, it fades.\"",

function storyText(paras){return paras.map(p=>{const seen=new Set();return `<p>${esc(p).replace(/\*([^*]+)\*/g,(m,w)=>{const k=w.toLowerCase(),W=WORDS[k];const say=W&&!seen.has(k)?` <small class="ssay">(${W.say})</small>`:"";seen.add(k);return `<span class="tl">${w}</span>${say}`})}</p>`}).join("")}
function storyView(){

 const Q=QUESTS[S.storyQ]||QUEST1,pages=Q.story,i=Math.max(0,Math.min(S.page,pages.length-1)),pg=pages[i],last=i===pages.length-1,sc=Q.scenes[pg.scene];
 app.innerHTML=`<div class="hud"><button class="iconbtn" id="exit">Lola's Notebook</button><span class="eyebrow">Page ${i+1} of ${pages.length}</span></div>
 <div class="frame"><div class="stage"><svg class="art" viewBox="0 0 400 300" role="img" aria-label="${esc(pg.title)}">${U(sc.art(pg.flags||{}))}</svg><div class="scene-name">${esc(pg.title)}</div></div></div>
 <div class="storypage"><div class="eyebrow" style="color:var(--ink-soft)">Read it as a story · Quest ${Q.n} · ${esc(Q.title)}</div>
  ${i===0?`<p class="storytip">For grown-ups: read this aloud like a bedtime story. Tagalog words are in color, with how to say them in small print. Pause at each one and say it together.</p>`:""}
  ${storyText(pg.text)}
  ${last?`<div class="storyend"><b>The end.</b><button class="btn ghost small" id="smyth" style="color:var(--ink)">About this story</button></div>`:""}
  <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="sprev" style="color:var(--ink)" ${i===0?"disabled":""}>Back</button>${last?`<button class="btn ink" id="splay">Play this quest</button>`:`<button class="btn ink" id="snext">Next page</button>`}</div></div>`;
 $("#exit").onclick=()=>{S.screen="map";render();scrollTo(0,0)};
 $("#sprev").onclick=()=>{S.page=i-1;render();scrollTo(0,0)};
 const n=$("#snext");if(n)n.onclick=()=>{S.page=i+1;render();scrollTo(0,0)};
 const pl=$("#splay");if(pl)pl.onclick=()=>{audio();startQuest(Q.n)};
 const m=$("#smyth");if(m)m.onclick=()=>sheet(`<div class="eyebrow" style="color:var(--ink-soft)">For grown-ups</div><h2>${Q.mythTitle}</h2><p>${Q.myth}</p><button class="btn ink" data-close>Close</button>`);
}

function tone(f,t,d,type="sine",g=.2){ if(!AC) return; const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime+t);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);o.connect(v);v.connect(master);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05) }
const sfx={
 chime(){[880,1108,1320,1760].forEach((f,i)=>tone(f,i*.07,.6,"sine",.12))},
 soft(){tone(520,0,.18,"triangle",.1)},

};
function ambient(kind){ if(!AC) return; if(amb){try{amb.stop()}catch(e){} amb=null}
 if(!kind) return; const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter(),g=AC.createGain();
 if(kind==="sea"){f.type="lowpass";f.frequency.value=500;g.gain.value=.05;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.15;lg.gain.value=.04;l.connect(lg);lg.connect(g.gain);l.start()}
 else{f.type="bandpass";f.frequency.value=4200;f.Q.value=30;g.gain.value=.03;const l=AC.createOscillator(),lg=AC.createGain();l.type="square";l.frequency.value=7;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);l.start()}
 src.connect(f);f.connect(g);g.connect(master);src.start();amb=src }

 $("#art").classList.remove("seeking","hinting","carving");$("#stage").onclick=null;panel.innerHTML="";

 if(!cond(b.if)) return next();
 flushShot();
 if(b.set)Object.assign(S.flags,b.set);
 if(b.seek||b.learn||b.enc||b.noise){if(S.shot)S.shot=null;redrawArt();camTo(null,600)}
 else{if(b.shot!==undefined&&(b.shot||null)!==(S.shot||null))setShot(b.shot);else if(b.set)redrawArt();if(b.cam!==undefined)camTo(b.cam)}
 if(b.say) return dialog(b.say,b.t,next);
 if(b.seek) return seek(sc,b);
 if(b.pick) return pick(b);
 if(b.enc) return encounter(b);
 if(b.word){dialog("narr",b.t,null);return wordCard(b.word,"",next,panel)}
 if(b.count) return count(b.count);
 if(b.noise) return noise();
 if(b.together) return together(b);
 if(b.learn) return learnBeat(b);
 if(b.decode) return decodeBeat(b);
 if(b.write) return writeBeat(b);
 if(b.charades) return charades(b.charades);
 if(b.match) return match(b.match);
 if(b.duel) return duel(b.duel);
 if(b.read) return readBack();
 if(b.twist) return twistBeat();
 if(b.bakroll) return bakRollBeat();
 if(b.end) return end();
}

function match(m){const M=typeof m==="object"?m:{},panel=$("#panel");
 const pool=S.pouch.filter(w=>WORDS[w]&&WORDS[w].opts).slice(-6);
 if(pool.length<3)return next();
 const cards=[...pool.map(w=>({w,t:"tl",txt:w})),...pool.map(w=>({w,t:"en",txt:WORDS[w].m}))].sort(()=>Math.random()-.5);
 let open=[],done=new Set(),who=0,score=PL().map(()=>0),lock=false;
 dialog(M.who||"tomas",M.t||"Ay, my eyes are still asleep. My word labels are all mixed up! Take turns and match each word to what it means.",null);
 const draw=(msg="")=>{panel.innerHTML=turn(PL()[who],`${esc(pName(PL()[who]))}'s turn. Flip two cards. A match means you go again.`)+
  `<div class="scores">${PL().map((p,i)=>`<span class="t${p.role} ${i===who?"cur":""}">${esc(pName(p))} <b>${score[i]}</b></span>`).join("")}</div>
  <div class="mgrid">${cards.map((c,j)=>{const up=done.has(c.w)||open.includes(j);return `<button class="mcard ${up?'up':''} ${done.has(c.w)?'done':''} ${c.t}" data-j="${j}" ${up?'disabled':''} aria-label="${up?c.txt:'Face-down card'}">${up?c.txt:''}</button>`}).join("")}</div><div class="msg" aria-live="polite">${msg}</div>`;
  panel.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{if(lock)return;open.push(+b.dataset.j);sfx.soft();
   if(open.length<2)return draw();
   const[a,c]=open.map(k=>cards[k]);lock=true;
   if(a.w===c.w){done.add(a.w);score[who]++;wordXP(a.w);sfx.win();draw(`Match! Both say <b>${a.w}</b> out loud.`);setTimeout(()=>{open=[];lock=false;done.size===pool.length?fin():draw()},1400)}
   else{draw("Not a match. Remember where they were!");sfx.no();setTimeout(()=>{open=[];lock=false;who=(who+1)%PL().length;draw()},1200)}})};
 const fin=()=>{panel.innerHTML=`<div class="offscreen"><div class="eyebrow">All matched</div><b>${PL().map((p,i)=>`${esc(pName(p))} ${score[i]}`).join(", ")}. ${M.fin||"Mang Tomas is wide awake now."}</b><button class="btn" id="mf">Keep going</button></div>`;$("#mf").onclick=()=>{panel.innerHTML="";next()}};
 draw()}

function strokeSVG(t,o={}){const {P,mk}=STROKES[t]?{P:STROKES[t],mk:false}:sylPaths(t);if(!P.length)return"";
 const id="sk"+(_sid++),anim=o.anim,dur=o.dur||.9,vb=o.vb||(mk?"10 -14 380 400":"10 40 380 280"),R=o.r||17,FS=Math.round(R*1.25),A=o.arrow||"#a8452c";
 const placed=[];const st=P.map((d,i)=>{const n=d.match(/-?\d+/g).map(Number),x0=n[0],y0=n[1],j=Math.min(n.length-2,6);let tx=n[j]-x0,ty=n[j+1]-y0;const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
  const short=n.length<=4&&L<10;const cands=short?[[1,0],[-1,0],[0,-1],[0,1]]:[[-tx,-ty],[-ty,tx],[ty,-tx],[-tx-ty,-ty+tx],[-tx+ty,-ty-tx]];let best=null;const off=R+8;
  for(const[cx,cy]of cands){const l=Math.hypot(cx,cy),x=x0+cx/l*off,y=y0+cy/l*off;if(!placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<R*2.2)){best=[x,y];break}}
  if(!best)best=[x0-tx*off,y0-ty*off];placed.push(best);return {d,x:Math.round(best[0]),y:Math.round(best[1]),i,short}});
 const t0=i=>(i*dur+.2).toFixed(2);

/* ---------- Decode a page of Lola's notebook ---------- */
function decodeBeat(b){
 const D=b.decode,L=lessonFor(D.word),hard=S.mode==="hard",locked=hard&&D.lock,panel=$("#panel");let pos=0;const cache={};
 dialog("scribe",locked?"This page is locked to us until we can read it. Let's use the key page.":"Let's decode it with the key page. {k}, you found the shapes, so help me.",null);
 const draw=(msg="")=>{
  const ch=L.syl[pos];
  if(ch&&!cache[pos]){const all=keyOptions().filter(o=>o.gl!==ch[0]&&o.s!==ch[1]).sort(()=>Math.random()-.5).slice(0,hard?5:2);cache[pos]=[{gl:ch[0],s:ch[1]},...all].sort(()=>Math.random()-.5)}
  panel.innerHTML=turn("scribe",ch?`Find the glowing shape on the key page. What sound is it? ${esc(K())}, help look.`:"You read it!")+
  `<div class="notebook decode"><div class="hd">Lola's notebook · ${D.title}${locked?' <span class="lock">Locked</span>':""}</div>
   <div class="chunks">${L.syl.map((s,i)=>`<div class="chunk ${i<pos?"done":""} ${i===pos?"now":""}"><span class="gl" lang="tl-Tglg">${s[0]}</span><small>${i<pos?s[1]:"?"}</small></div>`).join("")}</div>
   ${ch?`<div class="sopts">${cache[pos].map(o=>`<button class="sopt" data-s="${o.s}">${o.s}</button>`).join("")}</div>`:
   `<div class="solved">${L.syl.map(s=>s[1]).join(" · ")} = <b>${D.word}</b>${WORDS[D.word]?` <span>(${WORDS[D.word].m})</span>`:""}</div>${recBar(D.word)}<button class="btn ink" id="dc">Say it together: ${D.word}</button>`}
   <div class="msg" id="msg" aria-live="polite">${msg}</div>
   ${ch?`<div class="row"><button class="btn ghost small" id="dh" style="color:var(--ink)">${hard?"Hint (costs 1 tapang)":"Hint"}</button>${locked?"":`<button class="btn ghost small" id="ds" style="color:var(--ink)">Skip this page</button>`}</div>`:""}
  </div>${keyChart()}`;
  panel.querySelectorAll(".sopt").forEach(o=>o.onclick=()=>{
   if(o.dataset.s===ch[1]){pos++;sfx.chime();draw()}
   else{o.classList.add("no");o.disabled=true;sfx.no();$("#msg").textContent=`That would be ${o.dataset.s}. Compare the glowing shape with your key page.`}});
  const h=$("#dh");if(h)h.onclick=()=>{
   if(hard){if(S.tapang<=0){$("#msg").textContent="No tapang left for hints. Look carefully at the key page.";return}S.tapang--;party()}
   panel.querySelectorAll(".sopt").forEach(o=>{if(o.dataset.s===ch[1])o.classList.add("hint")});sfx.soft()};
  const sk=$("#ds");if(sk)sk.onclick=()=>{panel.innerHTML="";dialog("narr",D.skip,next)};
  bindRec(panel);
  const dc=$("#dc");if(dc)dc.onclick=()=>{S.decoded=(S.decoded||0)+1;Object.assign(S.flags,D.set||{});if(WORDS[D.word])addWord(D.word);wordXP(D.word);sfx.win();panel.innerHTML="";dialog("narr",D.ok,next)};
 };
 draw();
}

 <h2 style="margin-top:6px">Baybayin pages</h2>
 <p style="margin:0;font-size:14px;color:var(--ink-soft)">Pages come back when you write their word. ${S.written.length} of ${Object.keys(LESSONS).length} pages are bright this season.</p>
 <div class="pages">${Object.values(LESSONS).map(L=>`<div class="pg ${S.written.includes(L.word)?"on":""}"><span class="gl" lang="tl-Tglg">${L.text}</span><small>${S.written.includes(L.word)?L.word:"faded"}</small></div>`).join("")}</div>
 <h2 style="margin-top:6px">Key page · ${S.glyphs.length} of ${G_ORDER.length} shapes</h2>
 <p style="margin:0;font-size:14px;color:var(--ink-soft)">Tap a bright shape to see how to write it.</p><div id="kpw"></div><div class="chart">${G_ORDER.map(k=>`<div class="${S.glyphs.includes(k)?"kpk":"off"}" data-k="${k}"><span class="gl" lang="tl-Tglg">${G[k][0]}</span>${G[k][1]}</div>`).join("")}</div>
 <div class="chart">${Object.entries(MK).map(([k,M])=>`<div class="${S.marks.includes(k)?"":"off"}"><span class="gl" lang="tl-Tglg">${M.ex[1]}</span>${M.ex[3]}</div>`).join("")}</div>
 <p style="margin:0;font-size:14px;color:var(--ink-soft)">The notebook carries over to the next quest. It waits in the baul until then.</p><div class="row"><button class="btn ink" data-close>Close</button><button class="btn ghost small" id="toMap" style="color:var(--ink)">Replay or start over</button></div>`,()=>{$("#toMap").onclick=()=>{closeSheet();S.screen="map";render();scrollTo(0,0)};document.querySelectorAll("#sheet .kpk").forEach(c=>{c.style.cursor="pointer";c.onclick=()=>{const k=c.dataset.k;$("#kpw").innerHTML=`<div class="kpw">${strokeSVG(G[k][0],{anim:true,r:24})}<div><b style="font-family:var(--display);font-size:26px">${G[k][1]}</b><p style="margin:2px 0 0;font-size:14px;color:var(--ink-soft)">Follow the numbers. Try it on each other's palm.</p></div></div>`;$("#kpw").scrollIntoView({block:"nearest"})}})})}
function sheet(html,after){$("#sheet").innerHTML=html;$("#sheetBg").hidden=false;$("#sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);if(after)after();const f=$("#sheet").querySelector("button");if(f)f.focus()}
function closeSheet(){$("#sheetBg").hidden=true}
$("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

render();
</script>

</body></html>
